# .NET Core Function App to Windows on Azure
# Build a .NET Core function app and deploy it to Azure as a Windows function App.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/en-us/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

variables:
  # Azure Resource Manager connection
  azureSubscription: 'Azure Vostok (60447d26-d388-4a2b-a8cd-45114f7099a8)'

  # Agent VM image name
  vmImageName: 'ubuntu-22.04'

  # Working Directory
  workingDirectory: '$(System.DefaultWorkingDirectory)/MemesFinderTextProcessor'

stages:
- stage: Build
  displayName: Build And Test
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.x
    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: '$(workingDirectory)/*.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/$(Build.BuildId)'
        zipAfterPublish: true
        modifyOutputPath: false
    - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)/$(Build.BuildId).zip'
      artifact: drop

- stage: DeployTest
  displayName: Deploy Test
  dependsOn: Build
  condition: succeeded('Build')
  jobs:
  - deployment: Test
    displayName: Deploy Text Processor
    environment: 'Test'
    variables:
     - group: Test
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureFunctionApp@1
            displayName: 'Azure functions app deploy'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'functionApp'
              appName: '$(functionappname_textprocessor)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              deploymentMethod: 'auto'

- stage: DeployProd
  displayName: Deploy Production
  dependsOn: DeployTest
  condition: and(succeeded('DeployTest'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: Prod
    displayName: Deploy Text Processor
    environment: 'Production'
    variables:
     - group: Production
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureFunctionApp@1
            displayName: 'Azure functions app deploy'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'functionApp'
              appName: $(functionappname_textprocessor)
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              deploymentMethod: 'auto'